<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokedex-API</title>
  <link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/Models/assets/pokeball.png"/>
</head>
<body>
  <canvas id="exp-canvas"></canvas>
  <div id="start">
    <h2>Click to start!<br>
      <span><img src="/Models/assets/pikachu.png"></span>
      <span><img src="/Models/assets/evee.png"></span>
      <span><img src="/Models/assets/charmander.png"></span>
      <span><img src="/Models/assets/snorlax.png"></span>
      <span><img src="/Models/assets/jigglypuff.png"></span>
    </h2>
  </div>

  <div id="pokemon" class="screen">
    <form class="search">
      <input class="name" placeholder="Pikachu" />
    </form>
    <img id="imgPokemon" alt="" />
    <h3 id="namePokemon"></h3>
  </div>

  <div id="stats" class="screen statscreen">
    <div id="statPokemon" class="info"></div>
  </div>

  <div id="description">
    <div id="pokemonDescription"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>

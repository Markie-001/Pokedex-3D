<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokedex-API</title>
  <link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="exp-canvas"></canvas>
  <div id="start">
    <span>Click to start <br><strong>Pokedex</strong></span>
  </div>

  <div id="pokemon" class="screen">
    <form class="search">
      <input class="name" placeholder="Pikachu" />
    </form>
    <img id="imgPokemon" alt="" />
    <h3 id="namePokemon">Loading...</h3>
  </div>

  <div id="stats" class="screen statscreen">
    <div id="statPokemon" class="info">Loading...</div>
  </div>

  <div id="description" class="screen">
    <div id="pokemonDescription"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
